<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-Day American English Quest</title><style>
:root{--navy:#18233d;--mint:#9ee6c4;--cream:#fff8df;--yellow:#ffd76a;--pink:#ffb9c7;--blue:#9ed8ff;--white:#fffefa;--line:#2b3858;--shadow:0 7px 0 #cbd8d0;font-family:"Trebuchet MS","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--navy);background-color:#dff4ec;background-image:linear-gradient(#fff8 1px,transparent 1px),linear-gradient(90deg,#fff8 1px,transparent 1px);background-size:24px 24px;min-height:100vh}button,textarea,select{font:inherit}button{cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:11px 16px;background:var(--yellow);color:var(--navy);font-weight:900;box-shadow:0 4px 0 var(--line);transition:.15s}button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}button.alt{background:var(--white)}button.pink{background:var(--pink)}button:disabled{opacity:.45;cursor:default;transform:none}.shell{max-width:1080px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 18px;background:var(--white);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.brand{font-weight:1000;letter-spacing:.04em}.hud{display:flex;gap:18px;font-size:13px}.hud b{display:block;font-size:18px}.screen{display:none}.screen.active{display:block}.hero{min-height:680px;display:grid;place-items:center;text-align:center}.hero-card{max-width:780px;background:var(--cream);border:3px solid var(--line);border-radius:22px;padding:42px;box-shadow:12px 12px 0 #86bba8;position:relative}.hero h1{font-size:clamp(32px,7vw,64px);line-height:1;margin:12px}.coach{font-size:70px;animation:float 2.2s ease-in-out infinite}.mission{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.mini{background:var(--white);border:2px solid var(--line);border-radius:12px;padding:14px}.start{font-size:22px;padding:18px 34px;animation:pulse 1.5s infinite}.layout{display:grid;grid-template-columns:230px 1fr 250px;gap:16px;margin-top:18px}.panel{background:var(--white);border:2px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.day-list{display:grid;gap:8px}.day{width:100%;text-align:left;background:var(--white);box-shadow:0 2px 0 var(--line);padding:9px}.day.on{background:var(--mint)}.day.locked{opacity:.5}.path{display:flex;gap:6px;overflow:auto;margin:12px 0}.path span{min-width:max-content;padding:6px 8px;background:#edf1f0;border-radius:6px;font-size:11px}.path span.on{background:var(--mint);font-weight:900}.bar{height:12px;background:#e2e8e4;border:2px solid var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--yellow));transition:.35s}.cue{padding:22px;margin:18px 0;background:var(--cream);border:2px solid var(--line);border-radius:12px;font-size:20px;min-height:110px}.answer{width:100%;min-height:96px;border:2px solid var(--line);border-radius:10px;padding:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.count{font-size:60px;font-weight:1000;text-align:center;color:#ef6d7d;animation:pop .8s}.feedback{margin-top:14px;padding:14px;border:2px solid var(--line);border-radius:10px;background:#dff7e9}.bad{background:#ffe3e7;animation:shake .25s}.bubble{background:#eaf7ff;border:2px solid var(--line);border-radius:14px;padding:14px;position:relative}.guide button{width:100%;margin-top:8px;text-align:left;background:var(--white);font-size:12px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:20px}.map .node{padding:16px 8px;text-align:center;background:var(--white);border:2px solid var(--line);border-radius:14px}.node.done{background:var(--mint)}.node.current{background:var(--yellow)}.result{text-align:center;max-width:760px;margin:30px auto}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.xp{color:#d78a00;font-size:30px;font-weight:1000}.hidden{display:none!important}@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{filter:drop-shadow(0 0 10px #ffd76a);transform:scale(1.03)}}@keyframes pop{50%{transform:scale(1.2)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:900px){.layout{grid-template-columns:1fr}.guide{order:3}.day-list{grid-template-columns:repeat(5,1fr)}.day{font-size:10px}.map{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.mission,.result-grid{grid-template-columns:1fr}.hero-card{padding:24px}.hud{gap:8px}.hud span:nth-child(3){display:none}.shell{padding:10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">⭐ 15-DAY AMERICAN ENGLISH QUEST</div><div class="hud"><span>LEVEL<b id="level">1</b></span><span>XP<b id="xp">0</b></span><span>STREAK<b id="streak">1</b></span><span>TIME<b id="time">00:00</b></span></div></header>
<section id="home" class="screen active hero"><div class="hero-card"><div class="coach">🦊</div><small>PIXEL SPEAKING CAMP</small><h1>Speak Before You Think.</h1><p>15 天，把一个个实用句型练成三秒内的自然反应。</p><div class="mission"><div class="mini"><small>TODAY'S MISSION</small><b id="homeDay"></b></div><div class="mini"><small>TODAY'S PATTERN</small><b id="homePattern"></b></div><div class="mini"><small>MASTERY</small><b id="homeMastery"></b></div></div><button id="start" class="start">PRESS TO START ▶</button><div class="actions" style="justify-content:center"><button id="openMap" class="alt">15-DAY MAP</button></div></div></section>
<section id="train" class="screen"><div class="layout"><aside class="panel"><b>QUEST DAYS</b><div id="days" class="day-list"></div></aside><section class="panel"><small id="stageLabel"></small><h2 id="stageTitle"></h2><div class="bar"><i id="progress"></i></div><div id="path" class="path"></div><p id="instruction"></p><div id="countdown"></div><div id="cue" class="cue"></div><textarea id="answer" class="answer" placeholder="先开口，再输入英文核对。"></textarea><div class="actions"><button id="hear">🔊 HEAR</button><button id="show" class="alt">SHOW ANSWER</button><button id="mic" class="alt">🎙 SPEAK</button></div><div id="expected" class="hidden"></div><div id="feedback"></div><div class="actions"><button id="correct">CORRECT</button><button id="almost" class="alt">ALMOST</button><button id="slow" class="pink">TOO SLOW</button><button id="retry" class="alt">TRY AGAIN</button><button id="next" class="hidden">NEXT ▶</button></div></section><aside class="panel guide"><div class="coach" style="font-size:48px">🦊</div><div id="bubble" class="bubble">先听提示，再在三秒内开始说。答案不需要一次完美。</div><small>QUICK GUIDE · 内置讲解</small><button data-guide="meaning">这句话什么意思？</button><button data-guide="why">为什么这样说？</button><button data-guide="easy">再简单一点</button><button data-guide="more">再来三题</button><button data-guide="pronounce">发音拆解</button></aside></div></section>
<section id="map" class="screen"><div class="panel"><h2>15-Day Quest Map</h2><p>可返回补练未完成的天数。完成一天后解锁下一天。</p><div id="mapGrid" class="map"></div><div class="actions"><button id="backHome" class="alt">返回首页</button></div></div></section>
<section id="result" class="screen"><div class="panel result"><div class="coach">🏆</div><h1>LEVEL COMPLETE!</h1><div class="xp" id="xpGain"></div><div id="resultGrid" class="result-grid"></div><p id="reviewPlan"></p><div class="actions" style="justify-content:center"><button id="nextDay">NEXT DAY</button><button id="resultMap" class="alt">QUEST MAP</button></div></div></section></main><script>
'use strict';const $=x=>document.getElementById(x),KEY='quest15.v2';
const plans=[
['Plans changed','I was supposed to ___, but I ended up ___ing.','本来应该……，但最后却……','ended up 后接动词 -ing。'],['Asking for help','Could you help me ___?','你能帮我……吗？','Could you 用于礼貌请求。'],['Not understanding','I’m not sure what you mean by ___.','我不确定你说的……是什么意思。','what you mean by 后接名词或短语。'],['Explaining lateness','I’m sorry I’m late because ___.','抱歉我迟到了，因为……','先道歉，再简短说明原因。'],['Deadlines','Would it be possible to ___ by ___?','可以在……之前……吗？','Would it be possible 更委婉。'],['Group projects','Why don’t we ___ first?','我们为什么不先……呢？','Why don’t we 用于提出建议。'],['Talking to teachers','Could you go over ___ again?','你能再讲一遍……吗？','go over 表示复习或重新解释。'],['Course selection','I’m thinking about taking ___.','我正在考虑选……','think about 后接动词 -ing。'],['Making friends','Do you feel like ___ after school?','放学后你想……吗？','feel like 后接动词 -ing。'],['Homestay','Would you mind if I ___?','你介意我……吗？','Would you mind if 后用过去式更礼貌。'],['Transit','Do you know how I can get to ___?','你知道我怎么去……吗？','间接问句使用陈述语序。'],['Doctor visit','I’ve been feeling ___ since ___.','从……开始我一直感觉……','持续到现在用现在完成进行时。'],['Giving opinions','From my point of view, ___.','在我看来……','先给立场，再给理由。'],['Polite refusal','I’d love to, but I have to ___.','我很想去，但我必须……','先表达善意，再解释拒绝。'],['Final Canada Challenge','I was wondering if you could ___.','我想问问你能否……','I was wondering if 是自然的委婉请求。']];
const situations=['physics assignment','school bus','guidance counsellor','group presentation','cafeteria','homestay dinner','visa appointment','course change','gym practice','phone distraction'];
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}S=S||{day:0,xp:0,streak:1,seconds:0,days:{},weak:{},history:[]};let Q={stage:0,item:0,combo:0,correct:0,total:0,times:[],shown:false,start:0,repeat:0},voice=null,timer=null;
const stages=['Warm-up','Pattern Lock','Listen & Repeat','Substitution Drill','Transformation Drill','Rapid Response','Situation Drill','Final Boss'];
function save(){localStorage.setItem(KEY,JSON.stringify(S));hud()}function hud(){$('xp').textContent=S.xp;$('level').textContent=Math.floor(S.xp/250)+1;$('streak').textContent=S.streak;$('time').textContent=String(Math.floor(S.seconds/60)).padStart(2,'0')+':'+String(S.seconds%60).padStart(2,'0')}
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id))}function plan(){return plans[S.day]}function target(i=Q.item){let p=plan(),x=situations[(S.day+i)%situations.length];if(S.day===0)return ['I was supposed to study, but I ended up scrolling on my phone.','I was supposed to catch the school bus, but I ended up walking to school.','I was supposed to finish my assignment, but I ended up falling asleep.'][i%3];return p[1].replace('___',x).replace('___',i%2?'Friday':'lunch')}
function cue(){let t=target();if(Q.stage===0)return plan()[2]+'：'+t;if(Q.stage===1)return '核心结构：'+plan()[1]+'\n'+plan()[2];if(Q.stage===2)return t;if(Q.stage===3)return '替换提示：'+situations[(S.day+Q.item+2)%situations.length];if(Q.stage===4)return '变形提示：把句子改为否定或疑问形式。\n原句：'+t;if(Q.stage===5)return '三秒内说出：'+plan()[2];if(Q.stage===6)return '加拿大校园情境：向老师或同学说明与 '+situations[(S.day+Q.item)%10]+' 有关的问题。';return 'FINAL BOSS：不用帮助，围绕今天的句型说 3 句完整英语。'}
function expected(){let t=target();if(Q.stage===4)return t.startsWith('I was')?t.replace('I was','I wasn’t'):t;return t}
function render(){clearInterval(timer);$('answer').value='';$('feedback').className='';$('feedback').textContent='';$('expected').classList.add('hidden');$('expected').textContent='✅ '+expected();$('next').classList.add('hidden');$('stageLabel').textContent='DAY '+(S.day+1)+' · '+(Q.stage+1)+'/8';$('stageTitle').textContent=stages[Q.stage];$('progress').style.width=((Q.stage+1)/8*100)+'%';$('path').innerHTML=stages.map((x,i)=>'<span class="'+(i===Q.stage?'on':'')+'">'+(i+1)+'. '+x+'</span>').join('');$('instruction').textContent=Q.stage<3?'先听、理解并模仿。':Q.stage===7?'连续说三句，完成今天的挑战。':'听提示后在三秒内开始回答。';$('cue').textContent=cue();$('countdown').innerHTML='';$('show').disabled=false;Q.start=performance.now();if(Q.stage>=3&&Q.stage<=6)countdown();days()}
function countdown(){let n=3;$('countdown').innerHTML='<div class="count">3</div>';timer=setInterval(()=>{n--;$('countdown').innerHTML=n>0?'<div class="count">'+n+'</div>':'<div class="count">SPEAK!</div>';if(n<=0){clearInterval(timer);Q.start=performance.now()}},700)}
function chooseVoice(){let vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-US'&&/male|David|Guy|Christopher|Eric/i.test(v.name))||null;if(!voice)$('bubble').textContent='没有找到美式男声。请在设备中安装 English (United States) 男声。'}function speak(t,rate=1){chooseVoice();if(!voice)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.voice=voice;u.rate=rate;speechSynthesis.speak(u)}speechSynthesis.onvoiceschanged=chooseVoice;
function mark(type){Q.total++;let reaction=(performance.now()-Q.start)/1000;Q.times.push(reaction);let ok=type==='correct';if(ok){Q.correct++;Q.combo++;S.xp+=10+Math.min(Q.combo,10);$('feedback').textContent='✨ Correct! +'+(10+Math.min(Q.combo,10))+' XP';$('feedback').className='feedback'}else{Q.combo=0;let weak=type==='slow'?'反应速度':plan()[3];S.weak[weak]=(S.weak[weak]||0)+1;$('feedback').textContent=(type==='almost'?'差一点。':'再练一次。')+'\n正确：'+expected()+'\n原因：'+plan()[3]+'\n请跟读正确版本，再做相似提示。';$('feedback').className='feedback bad';speak(expected(),.85);Q.repeat=3}$('next').classList.remove('hidden');save()}
function advance(){Q.item++;let needed=Q.stage===7?1:Q.stage<3?2:3;if(Q.item>=needed){Q.item=0;Q.stage++;if(Q.stage>=8){finish();return}}render()}
function finish(){let acc=Math.round(Q.correct/Math.max(1,Q.total)*100),avg=(Q.times.reduce((a,b)=>a+b,0)/Math.max(1,Q.times.length)).toFixed(1),gain=Q.correct*12;S.days[S.day]={done:true,accuracy:acc,review1:Date.now()+86400000,review7:Date.now()+604800000};S.history.push({day:S.day,accuracy:acc,avg});S.xp+=gain;save();$('xpGain').textContent='+'+gain+' XP';$('resultGrid').innerHTML='<div class="mini">ACCURACY<b>'+acc+'%</b></div><div class="mini">AVG REACTION<b>'+avg+'s</b></div><div class="mini">BEST COMBO<b>'+Q.combo+'</b></div><div class="mini">MASTERY<b>'+Math.min(100,40+acc/2).toFixed(0)+'%</b></div><div class="mini">MAIN WEAK POINT<b>'+Object.keys(S.weak).sort((a,b)=>S.weak[b]-S.weak[a])[0]||'None'+'</b></div><div class="mini">DAY COMPLETE<b>'+(S.day+1)+'/15</b></div>';$('reviewPlan').textContent='复习安排：明天 + 7 天后';screen('result')}
function days(){$('days').innerHTML=plans.map((p,i)=>'<button class="day '+(i===S.day?'on':'')+' '+(i>S.day+1&&!S.days[i-1]?.done?'locked':'')+'" data-day="'+i+'">Day '+(i+1)+'<br><small>'+(S.days[i]?.done?'Complete':i===S.day?'In progress':'Available')+'</small></button>').join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let i=+b.dataset.day;if(i<=S.day+1||S.days[i-1]?.done){S.day=i;Q={stage:0,item:0,combo:0,correct:0,total:0,times:[],shown:false,start:0,repeat:0};save();render()}})}function map(){let now=Date.now();$('mapGrid').innerHTML=plans.map((p,i)=>{let d=S.days[i],due=d&&(d.review1<=now||d.review7<=now);return '<button class="node '+(d?.done?'done':i===S.day?'current':'')+'" data-map="'+i+'">🎯<br>DAY '+(i+1)+'<br><small>'+p[0]+'</small><br>'+(due?'🔔 Review due':d?.done?'✓ Complete':i<=S.day+1?'Available':'Locked')+'</button>'}).join('');document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{let i=+b.dataset.map;if(i<=S.day+1||S.days[i-1]?.done){S.day=i;Q.stage=0;Q.item=0;screen('train');render()}})}
$('start').onclick=()=>{screen('train');render()};$('openMap').onclick=()=>{screen('map');map()};$('backHome').onclick=()=>screen('home');$('resultMap').onclick=()=>{screen('map');map()};$('nextDay').onclick=()=>{S.day=Math.min(14,S.day+1);Q={stage:0,item:0,combo:0,correct:0,total:0,times:[],shown:false,start:0,repeat:0};screen('home');home();save()};$('hear').onclick=()=>speak(expected(),Q.stage===2?.85:1);$('show').onclick=()=>{$('expected').classList.remove('hidden');Q.shown=true;$('show').disabled=true};$('correct').onclick=()=>mark('correct');$('almost').onclick=()=>mark('almost');$('slow').onclick=()=>mark('slow');$('retry').onclick=()=>{speak(expected(),.8);$('feedback').textContent='Repeat ×3：跟读三遍后再回答。';$('next').classList.remove('hidden')};$('next').onclick=advance;
$('mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('bubble').textContent='浏览器不支持语音识别，请先说，再输入核对。';return}let r=new R();r.lang='en-US';r.onresult=e=>$('answer').value=e.results[0][0].transcript;r.onerror=()=>$('bubble').textContent='麦克风不可用，请检查权限。';r.start()};document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{let k=b.dataset.guide,m={meaning:plan()[2],why:plan()[3],easy:'简单版：'+target().split(',')[0]+'.',more:'新提示：'+situations.slice(Q.item,Q.item+3).join(' · '),pronounce:'分段朗读：'+expected().replace(/, /g,' / ')};$('bubble').textContent=m[k];if(k==='pronounce')speak(expected(),.7)});
function home(){$('homeDay').textContent='Day '+(S.day+1)+' · '+plans[S.day][0];$('homePattern').textContent=plans[S.day][1];$('homeMastery').textContent=(S.days[S.day]?.accuracy||0)+'%';$('start').textContent=S.days[S.day]?.done?'REPLAY DAY ▶':'PRESS TO START ▶'}setInterval(()=>{if(!document.hidden){S.seconds++;hud();if(S.seconds%10===0)save()}},1000);home();hud();chooseVoice();
</script></body></html>
