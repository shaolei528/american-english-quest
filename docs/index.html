<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美式英语学习室</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#21352f;background:#f5f6f3;line-height:1.65}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #dce3dc;padding-bottom:20px}h1{font-size:24px;margin:0}h2{font-size:23px}small,.mut{color:#62746b}.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;margin-top:24px}section,aside{background:white;padding:24px;border:1px solid #dfe6dd;border-radius:14px}button,select,textarea,input{font:inherit}button{cursor:pointer;background:#24634e;color:white;padding:10px 16px;border:0;border-radius:8px}button.secondary{background:#eef3ee;color:#284b3b}button:disabled{opacity:.5;cursor:default}select,textarea{width:100%;padding:12px;border:1px solid #bdcec0;border-radius:8px;background:white;color:#21352f}textarea{min-height:112px;resize:vertical}label{display:block;margin:12px 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.line{padding:12px 0;border-bottom:1px solid #edf0ec}.en{font-size:20px}.cn{color:#66786f;font-size:14px}#steps{display:flex;gap:7px;flex-wrap:wrap;padding:0;list-style:none}#steps li{font-size:12px;padding:5px 8px;background:#eef1ec;border-radius:5px}#steps li.active{background:#24634e;color:white}#feedback{white-space:pre-line;padding:12px 0}details{margin-top:18px}summary{cursor:pointer;color:#24634e}progress{width:100%;accent-color:#24634e}#cue{background:#f1f6ef;border-left:3px solid #548868;padding:15px;white-space:pre-line}#notice{color:#8b4c24}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #92b9a1;outline-offset:2px}@media(max-width:720px){.layout{grid-template-columns:1fr}main{padding:16px}header{align-items:flex-start}aside,section{padding:18px}}
</style></head><body><main><header><div><small>AMERICAN ENGLISH · 学习室</small><h1>每天，把英语说熟一点</h1><small>中文引导 · 美式英语 · FSI 风格操练</small></div><div><span id="time">00:00</span><br><small>今日有效学习</small></div></header><div class="layout"><aside><label for="unit">学习单元</label><select id="unit"></select><p id="summary" class="mut"></p><label for="speed">示范语速</label><select id="speed"><option value="0.8">慢速 0.8×</option><option value="1" selected>正常 1×</option></select><p class="mut">先听懂，再模仿和记忆；听提示作答，纠正后重复，最后迁移到自己的生活。</p><small>本站是自编美式英语课程，采用 FSI 风格操练；并非 FSI 官方原版教材。</small><details><summary>错题复习 <span id="mistakeCount"></span></summary><div id="mistakes"></div></details><details><summary>导入与备份</summary><p class="mut">导入含 theme、base（英文）、hint（中文）的 JSON 数组。课程会加入上方选择器。</p><label for="importData">课程 JSON</label><textarea id="importData" placeholder='[{"theme":"我的课程","base":"Could you explain that again?","hint":"你能再解释一遍吗？"}]'></textarea><div class="actions"><button id="import">导入课程</button><button class="secondary" id="export">备份学习记录</button></div><p id="importStatus" role="status"></p></details></aside><section><small id="unitTitle"></small><ol id="steps"></ol><progress id="progress" max="6" value="0"></progress><h2 id="stageTitle"></h2><p id="instruction"></p><div id="content"></div><div id="controls" class="actions"></div><div id="response"><label for="answer">你的英文回答</label><textarea id="answer" lang="en" autocomplete="off" placeholder="先开口说，再输入或使用语音识别核对。"></textarea><div class="actions"><button id="check">核对回答</button><button id="mic" class="secondary">语音输入</button><button id="model" class="secondary">听示范</button></div><small>核对的是文字与词序，不是发音评分。语音识别取决于浏览器，可能需要联网。</small></div><div id="feedback" role="status" aria-live="polite"></div><p id="notice" role="status"></p><div class="actions"><button id="next" hidden>继续</button><button id="restart" class="secondary">重练本单元</button></div><small>整合版 2026.09 · 一个学习入口</small></section></div></main><script>
'use strict';
const $=id=>document.getElementById(id),KEY='englishStudio.v1';
const topics=[
['课堂与作业','finish the assignment','完成作业','review the instructions','复习说明'],['校园生活','find the library','找到图书馆','join the club','加入社团'],['寄宿家庭','help with dinner','帮忙准备晚餐','wash the dishes','洗碗'],['朋友与交流','plan the weekend','安排周末','invite a friend','邀请朋友'],['购物与点餐','order lunch','点午餐','check the price','查看价格'],['交通与出行','find the bus stop','找到公交站','buy a ticket','买票'],['健康与就诊','make an appointment','预约就诊','talk to a doctor','和医生沟通'],['银行与住房','open an account','开户','ask about the rent','询问租金'],['兼职与工作','apply for the job','申请工作','prepare for the interview','准备面试'],['考试与学习','review this chapter','复习这一章','check my answers','核对答案'],['兴趣与活动','practice the guitar','练吉他','join the team','加入队伍'],['观点与讨论','explain my opinion','解释我的观点','give an example','举例']];
const units=topics.map((t,i)=>({id:'unit-'+i,title:t[0],action:t[1],other:t[3],lines:[['Could you help me '+t[1]+'?','你能帮我'+t[2]+'吗？'],['Sure. What do you need?','当然。你需要什么？'],['I need to '+t[1]+' today.','我今天需要'+t[2]+'。'],['Let’s do it together.','我们一起做吧。']]}));
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state&&typeof state==='object'?state:{};state.custom=Array.isArray(state.custom)?state.custom:[];state.sessions=state.sessions||{};state.days=state.days||{};state.mistakes=Array.isArray(state.mistakes)?state.mistakes:[];
function imported(x,i){return{id:'custom-'+i,title:x.theme,lines:[[x.base,x.hint]],custom:true}}
state.custom.filter(x=>x&&typeof x.base==='string'&&typeof x.hint==='string').forEach((x,i)=>units.push(imported(x,i)));
let current=units.find(x=>x.id===state.selected)||units[0],s,ready=false,rec=null,epoch=0,timer=null,deadline=0,started=false;
const stages=['听懂对话','模仿记忆','角色回忆','六类操练','快速反应','情境迁移'];
function persist(){state.selected=current.id;try{localStorage.setItem(KEY,JSON.stringify(state))}catch{$('notice').textContent='存储空间不足或不可用，请导出备份。'}}
function session(){s=state.sessions[current.id]||(state.sessions[current.id]={stage:0,item:0,rep:0,done:false});}
function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(x){return x.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim()}
function exact(a,b){return normalize(a)===normalize(b)}
function drills(){const a=current.action,b=current.other;return [
['替换 Substitution','I need to '+a+'.\n把动作换为：'+b,'I need to '+b+'.'],
['变形 Transformation','You need to '+a+'.\n把陈述句变成一般疑问句。','Do you need to '+a+'?'],
['扩展 Expansion','I need to '+a+'.\n在句末加入：today','I need to '+a+' today.'],
['回答 Response','What do you need to do today?\n回答今天需要做的事。','I need to '+a+' today.'],
['合并 Combination','I need to '+a+'. I need your help.\n用 so 合成一句。','I need to '+a+', so I need your help.'],
['复现 Reproduction','听一次示范，然后凭记忆复现。',current.lines[0][0]]];}
function target(){return s.stage===3||s.stage===4?drills()[s.item][2]:current.lines[s.item][0]}
function stop(){epoch++;clearInterval(timer);timer=null;deadline=0;started=false;if(window.speechSynthesis)window.speechSynthesis.cancel();if(rec){rec.abort();rec=null}}
function speak(lines,done){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){$('notice').textContent='浏览器不支持朗读，请使用支持语音合成的浏览器。';return}stop();const token=epoch;const voices=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase()==='en-us');if(!voices.length){$('notice').textContent='未找到美式英语语音。请在设备语音设置中安装 English (United States)，然后重试。';return}const voice=voices.find(v=>/Aria|Jenny|Google US|David/i.test(v.name))||voices[0];let i=0;function play(){if(token!==epoch)return;if(i===lines.length){if(done)done();return}const u=new SpeechSynthesisUtterance(lines[i++]);u.lang='en-US';u.voice=voice;u.rate=+$('speed').value;u.onend=play;u.onerror=()=>{$('notice').textContent='播放未完成，请重试。'};speechSynthesis.speak(u)}play()}
function options(){const sel=$('unit');sel.innerHTML=units.map(u=>'<option value="'+u.id+'">'+escapeHTML(u.title)+(u.custom?' · 自定义':'')+'</option>').join('');sel.value=current.id;}
function review(){ $('mistakeCount').textContent='('+state.mistakes.length+')';$('mistakes').replaceChildren();state.mistakes.slice(-20).reverse().forEach(m=>{const p=document.createElement('p');p.textContent=m.target;const b=document.createElement('button');b.textContent='练习此句';b.className='secondary';b.onclick=()=>{const u=units.find(x=>x.id===m.unit);if(u){current=u;session();s.stage=m.stage;s.item=m.item;s.rep=0;s.done=false;options();render()}};p.append(document.createElement('br'),b);$('mistakes').append(p)})}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;$('controls').append(b);return b}
function render(){stop();ready=false;persist();$('unitTitle').textContent=current.title;$('summary').textContent=units.filter(u=>state.sessions[u.id]?.done).length+' / '+units.length+' 个单元已完成';$('steps').innerHTML=stages.map((x,i)=>'<li class="'+(i===s.stage?'active':'')+'">'+(i+1)+'. '+x+'</li>').join('');$('progress').value=s.done?6:s.stage;$('stageTitle').textContent=s.done?'本单元已完成':stages[s.stage];$('answer').value='';$('feedback').textContent='';$('notice').textContent='';$('controls').replaceChildren();$('next').hidden=true;$('check').disabled=false;$('response').hidden=s.stage===0||s.done;$('content').replaceChildren();$('model').hidden=s.stage===5;$('mic').disabled=false;
if(s.done){$('instruction').textContent='你可以选择下一个单元，或从错题复习继续练习。';button('下一个单元',()=>{current=units[(units.indexOf(current)+1)%units.length];session();options();render()});return}
if(s.stage===0){$('instruction').textContent='先听完整对话，再对照中文理解。播放完毕后继续。';$('content').innerHTML=current.lines.map(l=>'<div class="line"><div class="en" lang="en">'+escapeHTML(l[0])+'</div><div class="cn">'+escapeHTML(l[1])+'</div></div>').join('');button('听完整示范',()=>speak(current.lines.map(l=>l[0]),()=>{ready=true;$('next').hidden=false}));}
else if(s.stage===1){$('instruction').textContent='从句尾逐段向前搭建，再完整模仿。每句准确完成后继续。';const l=current.lines[s.item],w=l[0].split(' '),parts=[w.slice(-2).join(' '),w.slice(-5).join(' '),l[0]].filter((x,i,a)=>a.indexOf(x)===i);$('content').innerHTML='<div class="line en">'+escapeHTML(l[0])+'</div><p class="cn">'+escapeHTML(l[1])+'</p><p>'+parts.map(escapeHTML).join('<br>')+'</p>';button('听逆向搭建',()=>speak(parts));}
else if(s.stage===2){$('instruction').textContent='凭中文提示回忆英文。听示范是辅助，不代表已经掌握。';$('content').textContent=current.lines[s.item][1];}
else if(s.stage===3||s.stage===4){const d=drills()[s.item];$('instruction').textContent=d[0]+' · 连续正确 '+s.rep+'/3。'+(s.stage===4?'点击开始后，在 3 秒内开始作答；完整回答可用 30 秒。':'答错后连续次数归零，纠正再练。');const p=document.createElement('div');p.id='cue';p.textContent=d[1];$('content').append(p);if(s.stage===4){$('check').disabled=true;button('开始本题',()=>{stop();started=true;deadline=Date.now()+3000;$('check').disabled=false;$('answer').focus();timer=setInterval(()=>{if(!deadline)return;const left=Math.max(0,deadline-Date.now());$('feedback').textContent='剩余 '+(left/1000).toFixed(1)+' 秒';if(left===0){clearInterval(timer);deadline=0;started=false;s.rep=0;$('check').disabled=true;$('feedback').textContent='时间到，请重新开始本题。';persist()}},100)});}}
else{$('instruction').textContent='结合自己的生活写至少两句英文。这里不做虚假的自动语义评分；请按清单自检。';$('content').textContent='□ 说明需求　□ 给出时间或原因　□ 使用本单元句型';}
review();}
function beginAnswer(){if(s.stage===4&&started&&deadline>Date.now()){started=false;deadline=Date.now()+30000}}
$('answer').addEventListener('input',beginAnswer);
$('check').onclick=()=>{if(s.stage===4&&(!deadline||Date.now()>deadline))return;const a=$('answer').value.trim();if(!a)return;if(s.stage===5){if(a.split(/[.!?。！？]+/).filter(x=>x.trim()).length<2){$('feedback').textContent='请写至少两句，并逐项检查上方清单。';return}ready=true;$('feedback').textContent='请自己核对意思、句型和时间表达，确认后完成本单元。';$('next').textContent='已自检，完成单元';$('next').hidden=false;return}clearInterval(timer);deadline=0;const t=target();if(!exact(a,t)){s.rep=0;state.mistakes=state.mistakes.filter(m=>m.target!==t);state.mistakes.push({target:t,unit:current.id,stage:s.stage,item:s.item});$('feedback').textContent='请纠正词序或用词。\n示范：'+t;speak([t]);if(s.stage===4)$('check').disabled=true;persist();review();return}state.mistakes=state.mistakes.filter(m=>m.target!==t);s.rep++;ready=true;$('check').disabled=true;$('feedback').textContent='文字与词序核对正确。请确认自己的节奏和发音。';$('next').textContent='继续';$('next').hidden=false;persist();review()};
$('next').onclick=()=>{if(!ready)return;if(s.stage===5){s.done=true}else if(s.stage===0){s.stage=1;s.item=0}else if(s.stage===1||s.stage===2){s.item++;if(s.item>=current.lines.length){s.item=0;s.stage++;if(current.custom&&s.stage===3)s.stage=5}}else if(s.rep>=3){s.rep=0;s.item++;if(s.item===6){s.item=0;s.stage++}}render()};
$('model').onclick=()=>speak([target()]);$('restart').onclick=()=>{if(confirm('重新开始本单元？其他单元的进度会保留。')){Object.assign(s,{stage:0,item:0,rep:0,done:false});render()}};
$('unit').onchange=()=>{current=units.find(u=>u.id===$('unit').value);session();render()};
$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('notice').textContent='本浏览器没有语音识别，请输入英文回答。';return}if(rec)rec.abort();const token=epoch;rec=new R();rec.lang='en-US';rec.interimResults=true;rec.onspeechstart=beginAnswer;rec.onresult=e=>{if(token!==epoch)return;$('answer').value=Array.from(e.results,x=>x[0].transcript).join(' ')};rec.onerror=()=>{$('notice').textContent='语音识别未完成，请检查麦克风权限或使用输入模式。'};rec.start()};
$('import').onclick=()=>{try{const text=$('importData').value;if(text.length>500000)throw Error('文件内容过大');const a=JSON.parse(text);if(!Array.isArray(a)||!a.length||a.length>200)throw Error('每次导入 1–200 条课程');const clean=a.map((x,i)=>{if(!x||['theme','base','hint'].some(k=>typeof x[k]!=='string'||!x[k].trim()||x[k].length>1000))throw Error('第 '+(i+1)+' 条的 theme、base、hint 必须是有效文字');if(!/[a-z]/i.test(x.base))throw Error('英文句子缺少英文');return{theme:x.theme.trim(),base:x.base.trim(),hint:x.hint.trim()}});clean.forEach(x=>{const i=state.custom.length;state.custom.push(x);units.push(imported(x,i))});persist();options();$('importStatus').textContent='已加入 '+clean.length+' 条；可在学习单元中选择。自定义句子包含听辨、模仿、回忆、迁移四步。'}catch(e){$('importStatus').textContent='导入失败：'+e.message}};
$('export').onclick=()=>{persist();const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='english-study-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function dateKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
let previous=Date.now();setInterval(()=>{const now=Date.now(),delta=Math.min(2,Math.max(0,(now-previous)/1000));previous=now;if(!document.hidden){const k=dateKey();state.days[k]=(state.days[k]||0)+delta;const n=Math.floor(state.days[k]);$('time').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}if(Math.floor(now/1000)%10===0)persist()},1000);
document.addEventListener('visibilitychange',()=>{previous=Date.now();if(document.hidden){stop();persist()}});window.addEventListener('pagehide',()=>{stop();persist()});session();options();render();
</script></body></html>
